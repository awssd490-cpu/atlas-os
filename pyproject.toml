[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.11.0"
description = "AI Operating System — modular framework for intelligent agents, memory, RAG, and workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Atlas Contributors"},
]
maintainers = [
    {name = "Atlas Contributors"},
]
keywords = [
    "ai", "agent", "rag", "retrieval", "framework",
    "llm", "knowledge-base", "embeddings", "vector-store",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/your-org/atlas"
Repository = "https://github.com/your-org/atlas"
Documentation = "https://github.com/your-org/atlas/tree/main/docs"
Issues = "https://github.com/your-org/atlas/issues"

[project.optional-dependencies]
dev = [
    "black>=26.5.0",
    "build>=1.2.0",
    "coverage>=7.0",
    "isort>=7.0.0",
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0",
    "twine>=6.0.0",
]
docs = [
]
benchmark = [
]
providers = [
]

[dependency-groups]
dev = [
    "black>=26.5.0",
    "build>=1.2.0",
    "coverage>=7.0",
    "isort>=7.0.0",
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0",
    "twine>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Linting & formatting (Phase 12.2 — CI/CD)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pragmatic rule set that matches the existing Atlas codebase.
# Bug-catching rules only: Pyflakes (F) + the formatting checks that don't
# require reformatting the current tree (E4, E7, E9).  Full strictness
# (Black/isort normalization, unused imports, etc.) is adopted incrementally.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Pre-existing findings, deliberately not fixed to avoid churning
    # completed work.  Remove these ignores as the tree is cleaned up.
    "E402",   # module import not at top of file (e.g. late `import uuid`)
    "F401",   # unused import (re-export style `__init__.py`)
    "F541",   # f-string missing placeholders
    "F811",   # redefinition of unused name (local import shadows import)
    "F821",   # undefined name (forward-reference under TYPE_CHECKING)
    "F841",   # unused variable
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
