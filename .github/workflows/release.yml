# Release automation for Atlas.
#
# Triggered by version tags (`v*`).  Runs the full test suite, builds the
# distributions, and creates a GitHub Release with the wheel and source
# distribution attached.  Stable version tags are also published to PyPI
# using trusted publishing (OIDC) — pre-release tags are not published so
# release candidates stay out of the stable PyPI index.
#
# Tag format matches the existing history: `v0.11.0`, `v0.11.0-alpha`, etc.
# A version tag also implies its `main` commit — the build below therefore
# runs at the tagged commit.
#
# PyPI publishing requires a PyPI "trusted publisher" configured for this
# repository:
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
# The environment below must exist with the correct OIDC settings.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: pip install ".[dev]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata and README
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-dist
          path: dist/
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: atlas-dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Stable releases are published to the public PyPI index.  Pre-release
    # tags (`-alpha`, `-beta`, `-rc`, ...) are skipped so candidates stay
    # out of the stable index.
    if: ${{ !contains(github.ref_name, '-') }}
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: atlas-dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
