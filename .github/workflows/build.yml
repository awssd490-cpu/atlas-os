# Distribution build for Atlas.
#
# Builds the wheel and source distribution, validates metadata and README
# rendering, and uploads the artifacts so they can be downloaded from the
# workflow run.

name: build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: pip install ".[dev]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata and README
        run: twine check dist/*

      - name: List build artifacts
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atlas-dist
          path: dist/
          if-no-files-found: error
